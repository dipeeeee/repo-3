<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Yo Yo Honey Singh</title>
    <style>
        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial, sans-serif;
            background:linear-gradient(135deg,#f7971e,#ffd200);
        }
        .card{
            width:350px;
            background:white;
            padding:25px;
            border-radius:20px;
            text-align:center;
            box-shadow:0 5px 20px rgba(0,0,0,0.3);
            transition:0.4s;
        }
        .card:hover{
            transform:scale(1.05);
        }
        img{
            width:250px;
            height:250px;
            object-fit:cover;
            border-radius:15px;
        }
        h1{
            color:#d97706;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Yo Yo Honey Singh</h1>
    <img src="https://i.ibb.co/mCJcjcfx/honey-singh.jpg" alt="Yo Yo Honey Singh">
    <h3>Popular Songs</h3>
    <p>Brown Rang</p>
    <p>Blue Eyes</p>
    <p>Desi Kalakaar</p>
    <p>Famous Indian rapper and music producer 🔥</p>
</div>
</body>
</html>
